version: "3.8"

services:
  spiffdb:
    image: postgres:11
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "1111:5432"
    volumes:
      - db-data:/var/lib/postgresql/data1
    networks:
      - forms-flow-spiff-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  forms-flow-spiff-network:
    driver: 'bridge'
volumes:
  db-data:
    driver: local
